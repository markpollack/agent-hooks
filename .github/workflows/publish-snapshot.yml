name: Publish Snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    # Pinned to an immutable build-tools commit. The upstream `verify-first` input defaults
    # to true, so the full test suite runs before the snapshot is deployed.
    uses: markpollack/build-tools/.github/workflows/publish-snapshot.yml@35297f1ade5f47c2925d6dab42a7e2d43bd734d0
    with:
      java-version: '17'
    secrets:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
