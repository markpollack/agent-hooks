name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Pinned to an immutable build-tools commit — a mutable @main reference would let an
    # upstream edit change what this repository's required build executes.
    uses: markpollack/build-tools/.github/workflows/ci-build.yml@35297f1ade5f47c2925d6dab42a7e2d43bd734d0
    with:
      # 21, not 17: agent-hooks-claude compiles against the Claude Agent SDK, which is Java 21
      # bytecode. agent-hooks-core/-spring/-gemini still target Java 17 (release=17).
      java-version: '21'
